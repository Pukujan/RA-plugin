[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ra-plugin"
version = "0.1.0"
description = "Model-independent Research Assurance core and OpenCode adapter experiment"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
ra-plugin = "ra_plugin.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

